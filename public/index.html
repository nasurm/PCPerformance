<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PC Radar</title><meta name="description" content="Compare your PC with game requirements."><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script defer src="/analysis.js"></script><script defer src="/app.js"></script></head>
<body>
<header class="masthead"><a class="brand" href="/" aria-label="PC Radar home"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 25V7h12c8 0 13 5 13 12v6H3Z"/><path d="M9 25V13h6c4 0 7 3 7 6v6M15 19v6"/></svg><span>PC RADAR</span></a><nav aria-label="Main navigation"><button class="nav active" data-view="library">Installed games <span id="nav-count">—</span></button><button class="nav" data-view="explore">Other games</button><button class="nav" data-view="upgrades">Upgrades</button></nav><button id="scan" class="button">Scan PC <span aria-hidden="true">↻</span></button></header>
<div class="layout"><aside class="machine"><div class="side-heading"><h2>Your PC</h2><button id="hardware-details" class="text-button">Details ↗</button></div><div id="specs"><p class="muted">Reading hardware…</p></div><div class="side-footer"><span class="connection-dot"></span>Local device<button id="settings" class="text-button">Settings</button></div></aside>
<main><div class="page-heading"><div><h1 id="page-title">Game compatibility</h1><p id="page-subtitle">Your hardware against the game's requirements.</p></div><div class="baseline"><span>Compare with</span><div class="segmented" role="group" aria-label="Requirement level"><button data-baseline="minimum">Minimum</button><button data-baseline="recommended" class="selected">Recommended</button></div></div></div>
<div id="notice" role="status" aria-live="polite"></div><div id="content"></div>
<footer><span>CPU & GPU comparisons are estimates. RAM is exact.</span><button id="method" class="text-button">Method & sources ↗</button><button id="exit-app" class="text-button" hidden>Exit</button></footer></main></div>
<dialog id="dialog" aria-labelledby="dialog-title"><button id="close-dialog" class="close" aria-label="Close dialog">×</button><div id="dialog-content"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
</body></html>
